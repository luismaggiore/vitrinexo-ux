<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña — Vitrinexo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet" />
  <link href="/src/style.css" rel="stylesheet" />
</head>
<body class="ob-shell">

  <nav class="ob-nav">
    <a href="landing.html" class="d-flex align-items-center gap-2 text-decoration-none">
      <img src="/src/assets/vitrinexo.svg" width="104" alt="Vitrinexo">
    </a>
  </nav>

  <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
    <div class="container-narrow">

      <!-- FORM: nueva contraseña -->
      <div id="step-form" class="card-vx">
        <div class="text-center mb-4">
          <div class="ob-success-icon mx-auto mb-3" class="ob-success-icon--primary">
            <i class="ti ti-lock ob-success-check" ></i>
          </div>
          <h1 class="ob-title">Crear nueva contraseña</h1>
          <p class="ob-lead ob-lead--no-mb">Elige una contraseña nueva para tu cuenta en Vitrinexo.</p>
        </div>

        <div class="d-flex flex-column gap-3 mb-4">
          <div>
            <label class="form-label-vx">Nueva contraseña</label>
            <div class="input-group-vx">
              <span class="input-icon"><i class="ti ti-lock-plus"></i></span>
              <input type="password" id="pw1" placeholder="Mínimo 8 caracteres" oninput="checkStrength()">
            </div>
            <!-- Strength bar -->
            <div class="mt-2" id="strength-wrap" style="display:none">
              <div class="pw-strength-track">
                <div id="strength-bar" class="pw-strength-bar"></div>
              </div>
              <p class="form-hint mt-1" id="strength-label"></p>
            </div>
          </div>
          <div>
            <label class="form-label-vx">Repetir nueva contraseña</label>
            <div class="input-group-vx">
              <span class="input-icon"><i class="ti ti-lock-check"></i></span>
              <input type="password" id="pw2" placeholder="Repite tu contraseña" oninput="checkMatch()">
            </div>
            <p class="form-hint mt-1" id="match-msg" style="display:none"></p>
          </div>
        </div>

        <button class="btn-vx btn-primary-vx btn-vx-lg w-100" id="btn-save" onclick="savePassword()" disabled>
          <i class="ti ti-check me-1"></i> Guardar nueva contraseña
        </button>
      </div>

      <!-- SUCCESS -->
      <div id="step-success" class="card-vx text-center" style="display:none">
        <div class="ob-success-icon mx-auto mb-3">
          <i class="ti ti-check ob-success-check"></i>
        </div>
        <div class="ob-step-eyebrow">¡Listo!</div>
        <h2 class="ob-title">Contraseña actualizada</h2>
        <p class="ob-lead">Tu contraseña fue cambiada exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a href="login.html" class="btn-vx btn-primary-vx btn-vx-lg">
          Iniciar sesión <i class="ti ti-arrow-right ms-1"></i>
        </a>
      </div>

    </div>
  </div>

  <script>
    function checkStrength() {
      const pw = document.getElementById('pw1').value;
      const wrap = document.getElementById('strength-wrap');
      const bar  = document.getElementById('strength-bar');
      const lbl  = document.getElementById('strength-label');

      if (!pw) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';

      let score = 0;
      if (pw.length >= 8)  score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;

      const levels = [
        { w:'20%', bg:'var(--color-accent)',   text:'Muy débil' },
        { w:'40%', bg:'#f97316',               text:'Débil' },
        { w:'60%', bg:'#eab308',               text:'Regular' },
        { w:'80%', bg:'var(--color-success)',  text:'Buena' },
        { w:'100%', bg:'var(--color-success)', text:'Excelente' },
      ];
      const lvl = levels[Math.min(score, 4)];
      bar.style.width      = lvl.w;
      bar.style.background = lvl.bg;
      lbl.textContent      = lvl.text;

      checkMatch();
    }

    function checkMatch() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const msg = document.getElementById('match-msg');
      const btn = document.getElementById('btn-save');

      if (!pw2) { msg.style.display = 'none'; btn.disabled = true; return; }

      msg.style.display = 'block';
      if (pw1 === pw2 && pw1.length >= 8) {
        msg.textContent  = '✓ Las contraseñas coinciden';
        msg.style.color  = 'var(--color-success)';
        btn.disabled = false;
      } else {
        msg.textContent  = pw1 !== pw2 ? 'Las contraseñas no coinciden' : 'Mínimo 8 caracteres';
        msg.style.color  = 'var(--color-accent)';
        btn.disabled = true;
      }
    }

    function savePassword() {
      document.getElementById('step-form').style.display    = 'none';
      document.getElementById('step-success').style.display = 'block';
    }
  </script>
</body>
</html>
