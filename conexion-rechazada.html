<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitud procesada — Vitrinexo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet" />
  <link href="/src/style.css" rel="stylesheet" />
</head>
<body class="page-auth-vx">

  <nav class="navbar bg-white border-bottom px-4 py-2">
    <a href="landing.html" class="navbar-brand d-flex align-items-center gap-2">
      <img src="/src/assets/vitrinexo.svg" width="104" alt="Vitrinexo">
    </a>
  </nav>

  <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
    <div class="w-100" style="max-width:460px">
      <div class="card-vx text-center" style="padding:2.5rem 2rem">

        <div class="ob-success-icon mx-auto mb-3" style="background:var(--color-ice-300);border-color:var(--color-border)">
          <i class="ti ti-check ob-success-check" style="color:var(--color-text-secondary)"></i>
        </div>

        <span class="section-landing-label" style="color:var(--color-text-secondary)">Solicitud procesada</span>
        <h1 style="font-size:1.5rem;font-weight:400;letter-spacing:-.04em;color:var(--color-text-primary);margin:.5rem 0 .75rem;line-height:1.2">
          Listo. La solicitud<br>quedó registrada.
        </h1>
        <p class="text-md-muted" style="margin-bottom:2rem;line-height:1.6">
          La persona que te contactó no recibirá notificación del rechazo. Tu decisión es privada.
        </p>

        <div class="alert-vx alert-neutral mb-4 text-start">
          <i class="ti ti-shield-check"></i>
          <span style="font-size:13px">Si esta persona vuelve a contactarte y no te interesa, puedes reportarlo desde el directorio.</span>
        </div>

        <div class="d-flex gap-2">
          <a href="dashboard.html" class="btn-vx btn-soft-primary btn-vx-sm flex-grow-1">
            <i class="ti ti-home me-1"></i> Dashboard
          </a>
          <a href="directorio.html" class="btn-vx btn-ghost-vx btn-vx-sm flex-grow-1">
            <i class="ti ti-layout-grid me-1"></i> Directorio
          </a>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
